# Exposure through Envoy Gateway (Gateway API). The overlay sets the hostnames and the parent Gateway.
# Model turns take seconds: the route timeouts are raised well above Envoy's default.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: urgences
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: GATEWAY_NAME
      namespace: GATEWAY_NAMESPACE
  hostnames:
    - urgences.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: urgences-console
          port: 8092
          weight: 1
      timeouts:
        request: 180s
        backendRequest: 180s
